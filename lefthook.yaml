pre-commit:
  commands:
    # Staged files only; scripts/verify.sh runs the same Biome config on the whole tree.
    biome:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: node scripts/pre-commit-biome.mjs {staged_files}
      stage_fixed: true
    # Only the packages that own the staged files; dependents are left to verify.sh.
    type-check:
      glob: "*.{ts,tsx}"
      run: bash scripts/pre-commit-typecheck.sh {staged_files}
