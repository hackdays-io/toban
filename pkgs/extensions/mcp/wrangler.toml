name = "toban-mcp"
main = "src/worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers Logs — persist console.* output and uncaught exceptions, viewable in
# the Cloudflare dashboard (Workers & Pages → <worker> → Observability) and via
# `wrangler tail`. observability is NOT inherited by named environments, so it
# is repeated under [env.base] below.
[observability]
enabled = true
head_sampling_rate = 1

# ---------------------------------------------------------------------------
# Environments  (see DEPLOYMENT.md for the full runbook)
# ---------------------------------------------------------------------------
#   pnpm --filter @toban/mcp deploy:sepolia   # → toban-mcp       (top-level)
#   pnpm --filter @toban/mcp deploy:base      # → toban-mcp-base  (--env base)
#
# SEPOLIA IS THE TOP-LEVEL CONFIG, same convention as identity and discord-bot.
# There is deliberately no [env.sepolia]: a second Sepolia worker would only
# duplicate this one.
#
# Both environments live in the SAME Cloudflare account (kawabeyuki23). They
# are separated by worker name (`toban-mcp` / `toban-mcp-base`) and by D1
# (`toban-identity` / `toban-identity-base`), NOT by account.
#
# DEPLOY ORDER: identity -> discord-bot -> mcp -> openclaw. This worker
# service-binds to BOTH `toban-identity` (read-only identity resolution) and
# `toban-discord-bot` (the CONFIRM adapter for propose tools) BY NAME, so both
# must already exist or this deploy fails with Cloudflare error 10143.
#
# Wrangler does NOT inherit `vars` / `d1_databases` / `services` from the
# top-level into named environments — [env.base] fully redeclares them.
# ---------------------------------------------------------------------------

# --- Sepolia (staging) + `wrangler dev` default ----------------------------
# Same D1 as identity/discord-bot: `@toban/mcp` owns only its own tables in it
# (`mcp_tokens`, `used_mcp_auth_nonces`) and never touches the identity tables
# directly — see CLAUDE.md.
[[d1_databases]]
binding = "DB"
database_name = "toban-identity"
database_id = "6332ba44-8dfe-44c5-8baa-356763b4c7bf"

[[services]]
binding = "IDENTITY"
service = "toban-identity"

[[services]]
binding = "CONFIRM"
service = "toban-discord-bot"

[vars]
GOLDSKY_GRAPHQL_ENDPOINT = "https://api.goldsky.com/api/public/project_cm4r39viziqcd01wo6y96c1r6/subgraphs/toban-sepolia/1.0.3/gn"
HATS_GRAPHQL_ENDPOINT = "https://api.goldsky.com/api/public/project_cm4r39viziqcd01wo6y96c1r6/subgraphs/hats-v1-sepolia/0.0.1/gn"
TOBAN_FRONTEND_URL = "http://localhost:5173"
# RPC_URL is a secret (it embeds the Alchemy key) — never put it in [vars]:
#   wrangler secret put RPC_URL --env <env>   |   local dev: add it to .dev.vars
CHAIN_ID = "11155111"
TURNKEY_BOT_SIGNER_ADDRESS = "0xae4E13De7C14Dff7ff296De69cADf3A7F5208461"

# ===========================================================================
# Base (production)
# ===========================================================================
[env.base]
name = "toban-mcp-base"

[[env.base.d1_databases]]
binding = "DB"
database_name = "toban-identity-base"
database_id = "bf40df4f-9e12-48bf-9a80-ef90027d0ba7"

[[env.base.services]]
binding = "IDENTITY"
service = "toban-identity-base"

[[env.base.services]]
binding = "CONFIRM"
service = "toban-discord-bot-base"

[env.base.vars]
GOLDSKY_GRAPHQL_ENDPOINT = "https://api.goldsky.com/api/public/project_cm4r39viziqcd01wo6y96c1r6/subgraphs/toban-base/0.0.1/gn"
TOBAN_FRONTEND_URL = "https://toban.xyz"
# RPC_URL is a secret (it embeds the Alchemy key) — never put it in [vars]:
#   pnpm exec wrangler secret put RPC_URL --env base
CHAIN_ID = "8453"
TURNKEY_BOT_SIGNER_ADDRESS = "0x686B0B99768DE8EA34f63E890f7b9a2b7586D6e0"
# HATS_GRAPHQL_ENDPOINT is deliberately absent here — see the EXPECTED WARNING
# note below, same reasoning as discord-bot's wrangler.toml.

[env.base.observability]
enabled = true
head_sampling_rate = 1

# EXPECTED WARNING on `deploy:base` — do NOT "fix" it:
#   "vars.HATS_GRAPHQL_ENDPOINT exists at the top level, but not on env.base.vars"
# On Base the Hats endpoint is a The Graph Gateway URL that embeds an API key,
# so it is a SECRET there (not in [vars]), same as discord-bot's wrangler.toml.
# Adding it to [env.base.vars] to silence the warning would make the plaintext
# var OVERRIDE the secret at deploy time.

# ---------------------------------------------------------------------------
# Secrets (set per environment via `wrangler secret put <NAME> --env <env>`):
#   MCP_TOKEN_SECRET              - HMAC key behind /mcp's `tbn2` bearer
#                                   tokens (src/auth.ts). Moved here from
#                                   discord-bot as part of the extraction —
#                                   discord-bot no longer has this secret.
#   MCP_INTERNAL_PROPOSE_SECRET   - shared secret sent to discord-bot's
#                                   POST /internal/propose. MUST equal
#                                   discord-bot's value for the same env.
#   LOOKUP_READ_SECRET            - shared secret for identity /api/lookup
#                                   auth. MUST equal identity's AND
#                                   discord-bot's value for the same env.
#   RPC_URL                       - chain RPC (embeds the Alchemy key).
#   HATS_GRAPHQL_ENDPOINT (base)  - Base only: The Graph Gateway URL embeds
#                                   an API key, so it is a secret on Base.
#                                   Sepolia keeps the keyless Goldsky URL in
#                                   [vars].
# ---------------------------------------------------------------------------
